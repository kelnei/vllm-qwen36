# NVIDIA DGX Spark (GB10) variant of docker-compose.yml.
#
# Two things differ from the default file, for two unrelated reasons.
#
# The GB10's ~120 GB of memory is *unified* — the GPU and the OS share it:
#   - --gpu-memory-utilization is lower than the default file's 0.85: a high
#     fraction of *unified* memory starves the kernel rather than just the
#     engine. 0.92 livelocked the host outright (NVRM NV_ERR_NO_MEMORY, hard
#     power cycle) and even 0.85 drove MemAvailable to ~5 GiB during KV-cache
#     allocation.
#   - Disabling swap on the host is strongly recommended so memory exhaustion
#     OOM-kills the engine (container restarts) instead of thrashing:
#     sudo swapoff -a && comment the swap line in /etc/fstab.
#
# Separately, the GB10 prefills roughly 8x slower than a discrete Blackwell
# card (~1.3k tok/s vs ~11k on the 27B), which is why
# --max-num-batched-tokens is far smaller here — see the note on it below.
#
# Select this file via .env so ./start.sh works unchanged:
#   COMPOSE_FILE=docker-compose.spark.yml
services:
  vllm:
    # unsloth NVFP4 needs vLLM >= 0.25.0 (bundles flashinfer 0.6.13 + cutlass-dsl 4.5.2 for the cute-DSL W4A4 path)
    image: vllm/vllm-openai:v0.26.0
    container_name: vllm-qwen36
    restart: unless-stopped
    ipc: host
    ports:
      - "8000:8000"
    environment:
      - HF_TOKEN=${HF_TOKEN?Set HF_TOKEN in .env or export it}
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      # HF_HOME alone is enough: the hub cache derives as $HF_HOME/hub. Setting
      # HUGGINGFACE_HUB_CACHE to the HF_HOME root instead makes downloads land
      # beside hub/ rather than inside it, silently bypassing the mounted cache.
      - HF_HOME=/root/.cache/huggingface
    volumes:
      - huggingface_cache:/root/.cache/huggingface
      # persist torch.compile + FlashInfer autotune caches across container
      # recreation: warm start ~3 min instead of ~8
      - vllm_cache:/root/.cache/vllm
    command:
      # positional, not --model: v0.26.0 deprecates the flag and will remove it
      - "unsloth/Qwen3.6-27B-NVFP4"
      - "--served-model-name"
      - "qwen3.6-27b"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      # no --quantization flag: auto-detects compressed-tensors; forcing a backend
      # (e.g. marlin) drops decode throughput ~2.5x vs the auto-picked cute-DSL kernel
      - "--kv-cache-dtype"
      - "fp8"
      # fraction of *unified* memory; the remainder is all the OS gets (see header).
      # 0.85 measured unsafe: the KV-cache grab transiently drove host MemAvailable
      # below 5 GiB (livelock territory). 0.78 keeps the worst case >= ~13 GiB.
      - "--gpu-memory-utilization"
      - "0.78"
      - "--max-model-len"
      - "262144"
      - "--max-num-seqs"
      - "64"
      # 2048, not the default file's 32768: a chunked-prefill step blocks every
      # decoding request until it finishes, so the decode stall is
      # max-num-batched-tokens / prefill-rate. GB10 prefills the 27B at ~1.3k
      # tok/s, so a 32k chunk froze decode for ~25 s (measured p99 ITL 28.2 s)
      # and throttled prefill admission. Measured at 8k prompts, c8/c32/c64,
      # vs 32768: output throughput +27/+63/+41%, median TTFT -62/-61/-53%.
      # It also speeds prefill itself: an 8k prompt prefills in 3.64 s here vs
      # 6.23 s at 32768, while a 1k prompt (one chunk either way) is unchanged.
      # Swept 32768/8192/4096/2048/1024 — 2048 is the knee. 1024 gains another
      # 7% at c64 but loses 16% at c32 and worsens TTFT. Tuned on the 27B
      # dense model; the 35B-A3B MoE prefills ~2.7x faster and gains little.
      - "--max-num-batched-tokens"
      - "2048"
      - "--reasoning-parser"
      - "qwen3"
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "qwen3_xml"
      - "--speculative-config"
      - '{"method": "mtp", "num_speculative_tokens": 2}'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      # cold start (empty vllm_cache) compiles everything: allow 15 min
      start_period: 900s

volumes:
  huggingface_cache:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HOME}/.cache/huggingface
  vllm_cache:
